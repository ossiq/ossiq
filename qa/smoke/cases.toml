# ---------------------------------------------------------------------------
# upgrade: start, apply, test, continue, rollback, skip, abort
# ---------------------------------------------------------------------------
#
# npm-upgrade, pnpm-upgrade and uv-upgrade share one shape. The first dependency has a CVE, so it is
# always step 1 (CVEs queue first); the second has none, is stable at the standard tier, and breaks
# the project's test at the latest tier: it is step 2, and `fix/` holds the change that mends the test.
# The install step first: `start` runs the test command before changing anything, so the project
# must be installed. A step that expects exit 3 is the tests failing, which is the point.

[[cases]]
id = "npm-upgrade-happy"
project = "npm-upgrade"
why = "a one-step session at the standard tier: start, apply with passing tests, continue, and the session is gone"
covers = ["GH-179"]
steps = [
  { run = ["npm", "ci", "--ignore-scripts"] },
  { run = ["ossiq", "upgrade", "start", "--test-command", "node test.js", "."], stdout = { has = ["Upgrade: step 1 of 1", "semver", "PENDING"] } },
  { run = ["ossiq", "upgrade", "status", "."], stdout = { has = ["step 1 of 1", "PENDING"] } },
  { run = ["ossiq", "upgrade", "apply", "."], stdout = { has = ["AWAITING_REVIEW", "The tests passed"] }, locked = { semver = { at_least = "5.7.2", below = "6.0.0" }, escape-string-regexp = { equals = "4.0.0" } } },
  { run = ["ossiq", "upgrade", "continue", "."], stdout = { has = ["Step 1 done"] } },
  { run = ["ossiq", "upgrade", "status", "."], rc = "nonzero", output = { has = ["No upgrade session in this project"] } },
]

[[cases]]
id = "npm-upgrade-agent-loop"
project = "npm-upgrade"
why = "the loop a coding agent runs: JSON on stdout, exit 3 when the tests fail, a code fix, test until green, continue"
covers = ["GH-179", "TC-L08"]
steps = [
  { run = ["npm", "ci", "--ignore-scripts"] },
  { run = ["ossiq", "upgrade", "start", "--format", "agent", "--update-strategy", "latest", "--test-command", "node test.js", "."], stdout = { json = true, has = ['"outcome": "IN_PROGRESS"', '"needs_attention": false', '"total_steps": 2', '"baseline_exit_code": 0', '"status": "PENDING"'] } },
  { run = ["ossiq", "upgrade", "apply", "--format", "agent", "."], stdout = { json = true, has = ['"needs_attention": false', '"status": "AWAITING_REVIEW"', '"exit_code": 0'] }, locked = { semver = { at_least = "7.0.0" } } },
  { run = ["ossiq", "upgrade", "continue", "--format", "agent", "."], stdout = { json = true, has = ['"completed": 1', '"status": "PENDING"'] } },
  { run = ["ossiq", "upgrade", "apply", "--format", "agent", "."], rc = 3, stdout = { json = true, has = ['"needs_attention": true', '"status": "AWAITING_REFACTOR"', '"exit_code": 1', '"output_tail"'] }, locked = { escape-string-regexp = { at_least = "5.0.0" } }, declared = { escape-string-regexp = { changed = true } } },
  { run = ["ossiq", "upgrade", "continue", "--format", "agent", "."], rc = 3, stdout = { json = true, has = ['"status": "AWAITING_REFACTOR"'] } },
  { run = ["ossiq", "upgrade", "finish", "--format", "agent", "."], rc = 3, stdout = { json = true, has = ['"outcome": "IN_PROGRESS"'] } },
  { run = ["sh", "-c", "cp fix/test.js test.js"] },
  { run = ["ossiq", "upgrade", "test", "--format", "agent", "."], stdout = { json = true, has = ['"needs_attention": false', '"status": "AWAITING_REVIEW"'] } },
  { run = ["ossiq", "upgrade", "continue", "--format", "agent", "."], stdout = { json = true, has = ['"outcome": "COMPLETED"', '"completed": 2'] }, locked = { escape-string-regexp = { at_least = "5.0.0" } } },
]

[[cases]]
id = "npm-upgrade-rollback-skip"
project = "npm-upgrade"
why = "a failing step is rolled back to its preview, fails again, and is skipped with a reason; the kept step stays"
covers = ["GH-179"]
steps = [
  { run = ["npm", "ci", "--ignore-scripts"] },
  { run = ["ossiq", "upgrade", "start", "--update-strategy", "latest", "--test-command", "node test.js", "."] },
  { run = ["ossiq", "upgrade", "apply", "."], locked = { semver = { at_least = "7.0.0" } } },
  { run = ["ossiq", "upgrade", "continue", "."] },
  { run = ["ossiq", "upgrade", "apply", "."], rc = 3, stdout = { has = ["AWAITING_REFACTOR", "tests failed"] }, locked = { escape-string-regexp = { at_least = "5.0.0" } } },
  { run = ["ossiq", "upgrade", "rollback", "."], stdout = { has = ["PENDING"] }, locked = { escape-string-regexp = { equals = "4.0.0" } }, declared = { escape-string-regexp = { equals = "^4.0.0" } } },
  { run = ["ossiq", "upgrade", "apply", "."], rc = 3, stdout = { has = ["AWAITING_REFACTOR"] } },
  { run = ["ossiq", "upgrade", "skip", "--reason", "needs the ESM release", "."], stdout = { has = ["SKIPPED"] }, locked = { escape-string-regexp = { equals = "4.0.0" } }, declared = { escape-string-regexp = { equals = "^4.0.0" } } },
  { run = ["ossiq", "upgrade", "status", "."], rc = "nonzero", output = { has = ["No upgrade session in this project"] }, locked = { semver = { at_least = "7.0.0" } } },
]

