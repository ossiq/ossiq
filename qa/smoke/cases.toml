]

# ---------------------------------------------------------------------------
# AI integrations
# ---------------------------------------------------------------------------

[[cases]]
id = "skills-claude"
project = "empty"
why = "the skill and MCP entry are written to HOME without a token, and installing twice changes nothing"
covers = ["TC-L01", "TC-L02", "TC-L03", "TC-L11"]
steps = [
  { run = ["ossiq", "install", "skills", "bogus-tool"], rc = "nonzero", output = { has = ["Unknown tool 'bogus-tool'", "claude, codex, copilot, all"] } },
  { run = ["ossiq", "install", "skills", "claude"], stdout = { has = ["installed ossiq skill for claude", "uvx ossiq"] }, files = { "home/.claude/skills/ossiq/SKILL.md" = { has = ["ossiq-dependency-check"], lacks = ["{{ossiq}}"] }, "home/.claude/mcp.json" = { has = ['"ossiq"'], lacks = ["OSSIQ_GITHUB_TOKEN"] } } },
  { run = ["ossiq", "install", "skills", "claude"], files = { "home/.claude/mcp.json" = { once = ['"ossiq": {'] } } },
  { run = ["ossiq", "install", "skills", "claude", "--dev", "/opt/ossiq-src"], stdout = { has = ["uvx --from /opt/ossiq-src --no-cache ossiq"] }, files = { "home/.claude/mcp.json" = { has = ['"command": "uv"'] } } },
  { run = ["ossiq", "install", "skills", "claude", "--via", "npx"], stdout = { has = ["npx --yes @ossiq/cli"] } },
  { run = ["ossiq", "install", "skills", "claude", "--dev", "/opt/ossiq-src", "--via", "npx"], rc = "nonzero", output = { has = ["cannot be combined"] } },
]

