  { run = ["ossiq", "apply", "--yes", "."], locked = { idna = { at_least = "3.10" }, urllib3 = { at_least = "1.26.20" } }, declared = { idna = { equals = ">=3.0" }, urllib3 = { changed = true } } },
  { run = ["ossiq", "plan", "."], stdout = { lacks = ["Recommended"] } },
]

[[cases]]
id = "uv-pin-all"
project = "uv-ranges"
why = "--pin-all writes == for every updated direct dependency"
covers = ["TC-U07"]
steps = [
  { run = ["ossiq", "apply", "--pin-all", "--yes", "."], locked = { idna = { at_least = "3.10" }, urllib3 = { at_least = "1.26.20" } }, declared = { idna = { pinned = true }, urllib3 = { pinned = true } } },
]

[[cases]]
id = "uv-override"
project = "uv-ranges"
why = "--override pins a direct dependency to exactly the version asked for"
covers = ["TC-U15"]
steps = [
  { run = ["ossiq", "apply", "--override", "idna==3.7", "--yes", "."], locked = { idna = { equals = "3.7" } }, declared = { idna = { equals = "==3.7" } } },
]

[[cases]]
id = "uv-ignore"
project = "uv-ranges"
why = "--ignore keeps a package out of the plan and out of apply"
covers = ["TC-U01", "TC-U02"]
steps = [
  { run = ["ossiq", "plan", "--ignore", "idna", "."], stdout = { has = ["urllib3"], lacks = ["idna"] } },
  { run = ["ossiq", "apply", "--ignore", "idna", "--yes", "."], locked = { idna = { equals = "3.4" }, urllib3 = { at_least = "1.26.20" } } },
]

[[cases]]
id = "uv-rewrite"
project = "uv-pinned"
why = "an == pin is left alone unless --rewrite-versions asks for it"
covers = ["TC-U20"]
steps = [
  { run = ["ossiq", "plan", "."], stdout = { has = ["attrs"], lacks = ["Recommended"] } },
  { run = ["ossiq", "apply", "--rewrite-versions", "--yes", "."], locked = { attrs = { at_least = "23.2.0" } }, declared = { attrs = { pinned = true, changed = true } } },
]

# Extras. mkdocs-material fixes its CVE in 9.7.7, and every 9.8 release needs requests>=2.33.0,
# which requests~=2.32.5 leaves out.

[[cases]]
id = "uv-extras-widen"
project = "uv-extras"
why = "a ~= range in an extra is widened in place, like one in [project].dependencies"
covers = ["TC-U05", "GH-179"]
steps = [
  { run = ["ossiq", "apply", "--update-strategy", "latest", "--yes", "."], locked = { idna = { at_least = "3.10" }, mkdocs-material = { at_least = "9.8.0" }, requests = { at_least = "2.33.0" } }, declared = { idna = { changed = true, pinned = false }, mkdocs-material = { changed = true, pinned = false }, requests = { changed = true } } },
]

[[cases]]
id = "uv-extras-sibling-range"
project = "uv-extras"
why = "apply succeeds: an extra's CVE fix never needs requests past the range the plan leaves it in"
covers = ["GH-179"]
steps = [
  { run = ["ossiq", "apply", "--yes", "."], locked = { mkdocs-material = { at_least = "9.7.7" } } },
]

[[cases]]
id = "uv-extras-sibling-held"
project = "uv-extras"
why = "with requests left alone, mkdocs-material stops below 9.8 and the export says requests is why"
covers = ["GH-179", "TC-U01"]
steps = [
  { run = ["ossiq", "export", "--ignore", "requests", "--output", "export.json", "."], report = "export.json", packages = { mkdocs-material = { recommended_version = { at_least = "9.7.7", below = "9.8.0" } } }, files = { "workspace/export.json" = { has = ["requires requests (held at ~=2.32.5"] } } },
  { run = ["ossiq", "apply", "--ignore", "requests", "--yes", "."], locked = { mkdocs-material = { at_least = "9.7.7", below = "9.8.0" }, requests = { below = "2.33.0" } }, declared = { requests = { equals = "~=2.32.5" } } },
]

