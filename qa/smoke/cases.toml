# Smoke-matrix cases: see qa/smoke_matrix.py and qa/README.md.
#
# Registries move, so a version check says how far the result must have got (`at_least`, `below`),
# never what it is today. `equals` is for releases that cannot change: left-pad 1.3.0 is the last
# left-pad, uuid 3.4.0 the last 3.x, attrs 21.1.0 is yanked for good, and a version a step forces
# itself (`--override idna==3.7`).
#
# Step keys: run, rc (0 | "nonzero" | N), env, stdin, timeout, stdout / stderr / output
# ({ has, lacks, once, json }), locked / declared ({ pkg = { at_least, below, equals, missing,
# pinned, changed } }), report + packages (an export in the workspace), files (paths under the case
# directory: workspace/..., home/...). Unknown keys are an error.

# ---------------------------------------------------------------------------
# CLI surface
# ---------------------------------------------------------------------------

[[cases]]
id = "cli-help"
project = "empty"
why = "help and version work, removed flags are rejected, and a directory with no manifest is a clean error"
covers = ["TC-G01", "TC-H00", "TC-T01", "TC-U14", "TC-U17", "TC-O01"]
steps = [
  { run = ["ossiq", "--version"], stdout = { has = ["ossiq version:"] } },
  { run = ["ossiq", "--help"], stdout = { has = ["status", "plan", "apply", "export", "info", "add", "html", "install", "mcp", "auth"] } },
  { run = ["ossiq", "status", "--help"], stdout = { has = ["--format", "--ignore", "--production", "--allow-prerelease", "--registry-type", "--update-strategy", "--full"] } },
  { run = ["ossiq", "plan", "--help"], stdout = { has = ["--pin-all", "--rewrite-versions", "--override", "--ignore"], lacks = ["--script"] } },
  { run = ["ossiq", "apply", "--help"], stdout = { has = ["--yes", "--pin-all", "--rewrite-versions", "--override"] } },
  { run = ["ossiq", "plan", "--script", "."], rc = 2, output = { has = ["No such option"] } },
  { run = ["ossiq", "status", "."], rc = "nonzero", output = { has = ["Unable to identify Package Manager"] } },
]

[[cases]]
id = "cli-config"
project = "npm-semver"
why = "cooldown comes from the config file, an environment variable beats it, a flag beats both"
covers = ["TC-G09", "TC-G10", "TC-G11"]
add_files = { "ossiq.cfg" = "OSSIQ_COOLDOWN_PERIOD=21\n" }
steps = [
  { run = ["ossiq", "--config", "ossiq.cfg", "--verbose", "status", "."], output = { has = ["cooldown_period: 21"] } },
  { run = ["ossiq", "--config", "ossiq.cfg", "--verbose", "status", "."], env = { OSSIQ_COOLDOWN_PERIOD = "3" }, output = { has = ["cooldown_period: 3"] } },
  { run = ["ossiq", "--config", "ossiq.cfg", "--cooldown-period", "1", "--verbose", "status", "."], env = { OSSIQ_COOLDOWN_PERIOD = "3" }, output = { has = ["cooldown_period: 1"] } },
  { run = ["ossiq", "--config", "nope.cfg", "status", "."], rc = "nonzero", output = { has = ["Config file not found"] } },
]

[[cases]]
id = "policy-invalid"
project = "npm-semver"
why = "a mistyped key in .ossiq.yaml stops the command and names the key"
covers = ["GH-120"]
add_files = { ".ossiq.yaml" = "version: 1\npolicy:\n  cooldown:\n    dayz: 7\n" }
steps = [
  { run = ["ossiq", "status", "."], rc = "nonzero", output = { has = ["Invalid policy file", "dayz"] } },
]

# ---------------------------------------------------------------------------
# status / info / ecosystem detection
# ---------------------------------------------------------------------------

[[cases]]
id = "status-npm"
project = "npm-semver"
why = "status, its agent and --full forms, --production and info read an npm project without touching it"
covers = ["TC-C02", "TC-C09", "TC-C10", "TC-C03", "TC-G04", "TC-S06", "TC-L08", "TC-U04"]
steps = [
  { run = ["ossiq", "status", "."], stdout = { has = ["Registry: NPM", "semver", "ms", "Production: 1", "Dev: 1"] } },
  { run = ["ossiq", "status", "--production", "."], stdout = { has = ["Production: 1", "Dev: 0"], lacks = ["Development"] } },
  { run = ["ossiq", "status", "--format", "agent", "."], stdout = { json = true, has = ['"operation": "update"', '"registry": "npm"', '"package": "semver"'] } },
  { run = ["ossiq", "status", "--full", "."], stdout = { has = ["semver"] } },
  { run = ["ossiq", "info", "semver", "."], stdout = { has = ["semver"] } },
  { run = ["ossiq", "info", "semver", "--format", "agent", "."], stdout = { json = true, has = ['"operation": "add"', '"package": "semver"'] } },
  { run = ["ossiq", "info", "no-such-pkg-xyz-123", "."], rc = 1 },
]

[[cases]]
id = "status-uv"
project = "uv-ranges"
why = "a uv project is detected, scanned, and its export recommends something newer than the old lock"
covers = ["TC-G03", "TC-C01", "TC-S01", "TC-S10", "TC-L08"]
steps = [
  { run = ["ossiq", "status", "."], stdout = { has = ["Registry: PYPI", "idna", "urllib3"] } },
  { run = ["ossiq", "status", "--format", "agent", "."], stdout = { json = true, has = ['"registry": "pypi"'] } },
  { run = ["ossiq", "export", "--output", "export.json", "."], report = "export.json", packages = { idna = { installed_version = { equals = "3.4" }, recommended_version = { at_least = "3.10" } }, urllib3 = { installed_version = { equals = "1.26.5" }, recommended_version = { at_least = "1.26.20" } } } },
]

[[cases]]
id = "status-pip-classic"
project = "pip-classic"
why = "a bare requirements.txt is detected as PyPI"
covers = ["TC-G03"]
steps = [
  { run = ["ossiq", "status", "."], stdout = { has = ["Registry: PYPI", "idna"] } },
]

[[cases]]
id = "status-no-lock"
project = "uv-no-lock"
why = "a PEP 621 project before its first lock is scanned"
