# ---------------------------------------------------------------------------
# deprecated / yanked
# ---------------------------------------------------------------------------

[[cases]]
id = "deprecated-npm"
project = "npm-deprecated"
why = "deprecated releases are marked in status, export and the HTML report; left-pad has no successor"
covers = ["TC-C05", "TC-S07", "TC-H01", "TC-H05"]
steps = [
  { run = ["ossiq", "status", "."], stdout = { has = ["[DEPRECATED]", "left-pad", "uuid"] } },
  { run = ["ossiq", "export", "--output", "export.json", "."], report = "export.json", packages = { left-pad = { installed_version = { equals = "1.3.0" }, latest_version = { equals = "1.3.0" }, is_deprecated = { equals = true }, recommended_version = { missing = true } }, uuid = { installed_version = { equals = "3.4.0" }, is_deprecated = { equals = true }, recommended_version = { at_least = "3.4.0" } } } },
  { run = ["ossiq", "html", "--output", "report.html", "."], files = { "workspace/report.html" = { has = ["left-pad"] } } },
]

[[cases]]
id = "yanked-uv"
project = "uv-yanked"
why = "a yanked pin is marked, and the recommendation is a later release"
covers = ["TC-C04", "TC-S04", "TC-H05"]
steps = [
  { run = ["ossiq", "status", "."], stdout = { has = ["[YANKED]", "attrs"] } },
  { run = ["ossiq", "export", "--output", "export.json", "."], report = "export.json", packages = { attrs = { installed_version = { equals = "21.1.0" }, is_yanked = { equals = true }, recommended_version = { at_least = "21.2.0" } } } },
  { run = ["ossiq", "html", "--output", "report.html", "."], files = { "workspace/report.html" = { has = ["attrs"] } } },
]

# ---------------------------------------------------------------------------
# export
# ---------------------------------------------------------------------------

[[cases]]
id = "export-npm"
project = "npm-semver"
why = "every export schema parses and agrees on semver's recommendation; --production, --full and --ignore shape it"
covers = ["TC-E01", "TC-E02", "TC-E04", "TC-E05", "TC-E06", "TC-U03"]
steps = [
  { run = ["ossiq", "export", "."], files = { "workspace/ossiq_export_report_smoke-npm-semver.json" = { has = ['"production_packages"'] } } },
  { run = ["ossiq", "export", "--schema-version", "1.5", "--output", "e15.json", "."], report = "e15.json", packages = { semver = { recommended_version = { at_least = "5.7.2" } } } },
  { run = ["ossiq", "export", "--schema-version", "1.6", "--output", "e16.json", "."], report = "e16.json", packages = { semver = { recommended_version = { at_least = "5.7.2" } } } },
  { run = ["ossiq", "export", "--schema-version", "1.7", "--output", "e17.json", "."], report = "e17.json", packages = { semver = { recommended_version = { at_least = "5.7.2" } } } },
  { run = ["ossiq", "export", "--production", "--output", "prod.json", "."], report = "prod.json", packages = { semver = { installed_version = { equals = "5.7.1" } }, ms = { installed_version = { missing = true } } } },
  { run = ["ossiq", "export", "--full", "--output", "full.json", "."], files = { "workspace/full.json" = { has = ["dependency_tree"] } } },
  { run = ["ossiq", "export", "--ignore", "semver", "--output", "ignored.json", "."], report = "ignored.json", packages = { semver = { recommended_version = { missing = true } }, ms = { recommended_version = { at_least = "2.1.3" } } } },
]

# ---------------------------------------------------------------------------
# npm: update tiers, plan / apply flags
# ---------------------------------------------------------------------------

[[cases]]
id = "npm-security"
project = "npm-semver"
why = "the security tier moves only semver (it has a CVE), by the smallest diff, and leaves ms alone"
covers = ["TC-T07", "TC-U08", "TC-U13"]
steps = [
  { run = ["ossiq", "plan", "--update-strategy", "security", "."], stdout = { has = ["semver"] } },
  { run = ["ossiq", "apply", "--update-strategy", "security", "--yes", "."], locked = { semver = { at_least = "5.7.2", below = "6.0.0" }, ms = { equals = "2.0.0" } }, declared = { semver = { changed = true } } },
]

[[cases]]
id = "npm-standard"
project = "npm-semver"
why = "the standard tier moves both packages inside their caret ranges, and a second plan has nothing to recommend"
covers = ["TC-U08", "TC-U13", "TC-U19"]
steps = [
  { run = ["ossiq", "apply", "--yes", "."], locked = { semver = { at_least = "5.7.2", below = "6.0.0" }, ms = { at_least = "2.1.3", below = "3.0.0" } }, declared = { semver = { pinned = false }, ms = { pinned = false } } },
  { run = ["ossiq", "plan", "."], stdout = { lacks = ["Recommended"] } },
]

[[cases]]
id = "npm-latest"
project = "npm-semver"
why = "the latest tier widens semver's caret to the newest major"
covers = ["TC-U08"]
steps = [
  { run = ["ossiq", "apply", "--update-strategy", "latest", "--yes", "."], locked = { semver = { at_least = "7.6.3" }, ms = { at_least = "2.1.3" } }, declared = { semver = { changed = true } } },
]

[[cases]]
id = "npm-pin-all"
project = "npm-semver"
why = "--pin-all writes exact versions for every updated direct dependency"
covers = ["TC-U12"]
steps = [
  { run = ["ossiq", "apply", "--pin-all", "--yes", "."], locked = { semver = { at_least = "5.7.2", below = "6.0.0" }, ms = { at_least = "2.1.3" } }, declared = { semver = { pinned = true }, ms = { pinned = true } } },
]

[[cases]]
id = "npm-ignore"
project = "npm-semver"
why = "--ignore keeps a package out of the plan and out of apply"
covers = ["TC-U01", "TC-U02"]
steps = [
  { run = ["ossiq", "plan", "--ignore", "semver", "."], stdout = { has = ["ms"], lacks = ["semver CVE"] } },
  { run = ["ossiq", "apply", "--ignore", "semver", "--yes", "."], locked = { semver = { equals = "5.7.1" }, ms = { at_least = "2.1.3" } }, declared = { semver = { equals = "^5.7.1" } } },
]

[[cases]]
id = "npm-declined"
project = "npm-semver"
why = "answering no at the apply prompt changes nothing"
covers = ["TC-U18"]
steps = [
  { run = ["ossiq", "apply", "."], stdin = "n\n", output = { has = ["Proceed with"] }, locked = { semver = { equals = "5.7.1" }, ms = { equals = "2.0.0" } }, declared = { semver = { equals = "^5.7.1" } } },
]

[[cases]]
id = "npm-override"
project = "npm-transitive"
why = "--override forces a transitive package to an exact version through npm overrides; an unknown target is an error"
covers = ["TC-U15"]
steps = [
  { run = ["ossiq", "plan", "--override", "no-such-pkg==1.0.0", "."], rc = "nonzero", output = { has = ["not found in the dependency tree"] } },
  { run = ["ossiq", "apply", "--override", "ms==2.1.3", "--yes", "."], locked = { ms = { equals = "2.1.3" } }, files = { "workspace/package.json" = { has = ['"overrides"'] } } },
]

# vue pins @vue/server-renderer to its own version and the renderer peer-pins vue back. Only vue owns
# the renderer's copy, so the pick that moves vue moves the renderer too; the old copy must not hold
# vue below the release that fixes the renderer's CVE (3.5.42).

[[cases]]
id = "npm-lockstep"
project = "npm-lockstep"
why = "vue is not held back by the old @vue/server-renderer that peer-pins it: both move past the renderer's CVE, and no peer hold is left"
covers = ["GH-179"]
steps = [
  { run = ["ossiq", "plan", "."], stdout = { lacks = ["Held by peer dependencies"] } },
  { run = ["ossiq", "apply", "--yes", "."], locked = { vue = { at_least = "3.5.42", below = "4.0.0" }, "@vue/server-renderer" = { at_least = "3.5.42", below = "4.0.0" } } },
  { run = ["ossiq", "plan", "."], stdout = { lacks = ["Held by peer dependencies"] } },
]

