# DO NOT RENAME THIS FILE, and do not remove `environment: release` from publish-npm.
# npm's Trusted Publisher is bound to (ossiq/ossiq, binaries.yml, release), and npm
# validates the CALLING workflow's filename — so moving the publish step into a reusable
# workflow does not disturb that binding, but renaming this file would break it.
#
# Builds happen in reusable workflows so their provenance is signed under identities this
# file cannot assume (SLSA Build L3). Publishing stays here: it only transports
# already-attested bytes, and each publish job re-verifies them first.
#
# The `if: github.event_name == 'release'` guards are the safety net that makes
# workflow_dispatch runs build-and-attest only, never publish.
name: Build standalone binaries

on:
  workflow_dispatch:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    uses: ./.github/workflows/reusable-build-binaries.yml
    permissions:
      contents: read
      id-token: write
      attestations: write

  package-npm:
    needs: build
    if: github.event_name == 'release'
    uses: ./.github/workflows/reusable-build-npm.yml
    permissions:
      contents: read
      id-token: write
      attestations: write

  attach-to-release:
    name: Attach binaries to release
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify provenance before attaching
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for tarball in artifacts/*.tar.gz; do
            echo "::group::verify $tarball"
            gh attestation verify "$tarball" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/reusable-build-binaries.yml"
            echo "::endgroup::"
          done

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          (cd artifacts && sha256sum ./*.tar.gz > SHA256SUMS)
          gh release upload "$TAG_NAME" \
            artifacts/*.tar.gz artifacts/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber

  publish-npm:
    name: Publish to npm
    needs: package-npm
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    environment:
      name: release
      url: https://www.npmjs.com/package/@ossiq/cli
    permissions:
      # Required for npm Trusted Publishing (OIDC) — no NPM_TOKEN secret.
      id-token: write
      contents: read
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-tarballs
          path: .

      - name: Verify the tarballs we are about to publish
        # The attested bytes and the published bytes have to be the same object.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for tarball in npm/*.tgz; do
            echo "::group::verify $tarball"
            gh attestation verify "$tarball" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/reusable-build-npm.yml"
            echo "::endgroup::"
          done

      - name: Publish platform packages, then the launcher
        # Order matters: the launcher's optionalDependencies pin these exact versions,
        # so publishing it first would leave a window where `npm install @ossiq/cli`
        # cannot resolve a binary. Filenames come from the manifest rather than a glob,
        # which would match the launcher's own tarball alongside the platform ones.
        run: |
          set -euo pipefail
          mapfile -t platform_tarballs < <(python3 -c '
          import json
          m = json.load(open("build/npm/manifest.json"))
          for entry in m["platform_packages"]:
              print(entry["tarball"])
          ')

          for tarball in "${platform_tarballs[@]}"; do
            echo "::group::publish $tarball"
            npm publish "npm/$tarball" --provenance --access public
            echo "::endgroup::"
          done

          launcher="$(python3 -c 'import json;print(json.load(open("build/npm/manifest.json"))["launcher"]["tarball"])')"
          echo "::group::publish $launcher"
          npm publish "npm/$launcher" --provenance --access public
          echo "::endgroup::"
