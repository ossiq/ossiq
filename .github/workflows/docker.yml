name: Publish to Docker Hub

on:
  # Manual by design. The image installs `ossiq==<version>` from PyPI, so it can
  # only be built once that version is actually published — running it off the
  # release event would race the PyPI upload. Releases are infrequent and
  # deliberate, so this is triggered by hand once PyPI has the version.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to build, must already be on PyPI (e.g., v0.1.3)'
        required: true
        type: string
      latest:
        description: 'Move the `latest` tag to this build (untick when rebuilding an older version)'
        required: false
        default: true
        type: boolean

env:
  REGISTRY: docker.io
  IMAGE_NAME: ossiq/ossiq-cli

jobs:
  build-and-push:
    environment:
      name: release
      url: https://hub.docker.com/r/ossiq/ossiq-cli

    runs-on: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Resolve version and tags
        id: sanitize
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          WANT_LATEST: ${{ inputs.latest }}
        run: |
          set -euo pipefail

          # 'v0.1.3' -> '0.1.3'; an already-clean '0.1.3' is left alone.
          CLEAN_TAG="${INPUT_TAG#v}"

          if ! echo "$CLEAN_TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::'$CLEAN_TAG' is not a valid version."
            exit 1
          fi

          MINOR="$(echo "$CLEAN_TAG" | cut -d. -f1-2)"

          # A version with a prerelease suffix (0.3.0-rc1) must not claim the
          # rolling `0.3` tag, so only exact X.Y.Z versions get one.
          STABLE=false
          if echo "$CLEAN_TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            STABLE=true
          fi

          LATEST=false
          if [ "$STABLE" = "true" ] && [ "$WANT_LATEST" = "true" ]; then
            LATEST=true
          fi

          {
            echo "tag=$CLEAN_TAG"
            echo "minor=$MINOR"
            echo "stable=$STABLE"
            echo "latest=$LATEST"
          } >> "$GITHUB_OUTPUT"

          echo "Building $CLEAN_TAG (minor: $MINOR, stable: $STABLE, latest: $LATEST)"

      - name: Version must be on PyPI
        shell: bash
        run: |
          set -eu
          VERSION="${{ steps.sanitize.outputs.tag }}"

          # The image does `uv pip install ossiq==<version>`, so a typo or a run
          # started before the PyPI publish finished should fail here in seconds
          # rather than part-way through a multi-arch build.
          if ! curl -sfI "https://pypi.org/pypi/ossiq/${VERSION}/json" > /dev/null 2>&1; then
            echo "::error::ossiq==${VERSION} is not on PyPI. Publish it first, then re-run."
            exit 1
          fi
          echo "ossiq==${VERSION} is available on PyPI"

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.sanitize.outputs.tag }}
            type=raw,value=${{ steps.sanitize.outputs.minor }},enable=${{ steps.sanitize.outputs.stable == 'true' }}
            type=raw,value=latest,enable=${{ steps.sanitize.outputs.latest == 'true' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            TAG_VERSION=${{ steps.sanitize.outputs.tag }}

      - name: Generate build summary
        run: |
          echo "## Docker Image Published :whale:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms:** linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
