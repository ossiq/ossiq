# Builds the five standalone PyInstaller binaries and signs provenance over each tarball.
#
# In its own `workflow_call` file so the provenance is signed under an identity the
# caller cannot assume (SLSA Build L3). See reusable-build-dist.yml for the reasoning.
#
# Consumers verify with:
#   gh attestation verify ossiq-<target>.tar.gz --repo ossiq/ossiq \
#     --signer-workflow ossiq/ossiq/.github/workflows/reusable-build-binaries.yml
#
# The matrix is deliberately INTERNAL and this workflow takes no inputs. If the caller
# matrixed over it, `runner` would become a workflow_call input, and a caller could then
# point a build at an attacker-controlled self-hosted runner while this file's trusted
# identity still signed the result. That is falsifiable provenance.
name: reusable / build standalone binaries

on:
  workflow_call:

permissions: {}

env:
  # spa_app.html is committed, so no Node is needed to build the package.
  OSSIQ_SKIP_FRONTEND_BUILD: '1'
  PYTHON_VERSION: '3.13'

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest macOS GitHub still hosts, for the same reason as Ubuntu below: a
          # newer host can pull wheels tagged for a newer macOS and raise the floor.
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          # Built on the oldest supported Ubuntu so the glibc floor stays low.
          - runner: ubuntu-22.04
            target: linux-x64
          - runner: ubuntu-22.04-arm
            target: linux-arm64
          - runner: windows-latest
            target: win32-x64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Build binary
        run: uv run pyinstaller packaging/pyinstaller/ossiq.spec --noconfirm --distpath dist --workpath build

      - name: Smoke test
        # Runs before the attestation on purpose: an unexercised binary must not be
        # something this workflow's identity vouches for.
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN="dist/ossiq/ossiq.exe"
          else
            BIN="dist/ossiq/ossiq"
          fi

          "$BIN" --version
          "$BIN" --help > /dev/null

          # Exercises the native extensions (python-sat, CEL), the HTTP stack and
          # the packaged data read through importlib.resources. The HTTP cache is
          # left on so the second scan reuses the first one's responses.
          "$BIN" status testdata/npm/project1
          "$BIN" html testdata/npm/project1 --output "$RUNNER_TEMP/report.html"
          test -s "$RUNNER_TEMP/report.html"

          # The MCP server must answer initialize on stdout as clean JSON-RPC.
          # Written to a file rather than piped, so the binary is never SIGPIPEd.
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | "$BIN" mcp > "$RUNNER_TEMP/mcp.jsonl"
          grep -q '"serverInfo"' "$RUNNER_TEMP/mcp.jsonl"
        env:
          OSSIQ_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # gzip -n drops the mtime from the gzip header, so the tarball does not
          # change just because CI ran at a different time. `tar --sort=name` is
          # bsdtar-incompatible (macOS runners), so member order is left alone.
          # bsdtar also rejects GNU's --owner/--group; --uid/--gid are its spelling.
          if [[ "$(tar --version)" == *bsdtar* ]]; then
            OWNER_FLAGS=(--uid 0 --gid 0)
          else
            OWNER_FLAGS=(--owner=0 --group=0)
          fi
          tar --numeric-owner "${OWNER_FLAGS[@]}" -cf - -C dist ossiq \
            | gzip -n -9 > "artifacts/ossiq-${{ matrix.target }}.tar.gz"
          ls -la artifacts

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/ossiq-${{ matrix.target }}.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ossiq-${{ matrix.target }}
          path: artifacts/ossiq-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7
