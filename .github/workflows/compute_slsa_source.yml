# SLSA Source L3: records source provenance for every push to a protected branch or tag,
# stored in git notes (refs/notes/*). release.py looks this workflow up by its filename and
# waits for its run on the release commit before pushing the tag, because a tag's
# attestation takes its level from its commit's.
#
# No `concurrency:` group on purpose: GitHub cancels a queued run when a newer one joins
# the group, and a cancelled run leaves that commit without provenance.
name: SLSA source provenance

on:
  push:
    branches: [main, 'release/*']
    tags: ['**']

permissions: {}

jobs:
  provenance:
    # sourcetool matches only push/force_push/pr_merge activity, so a branch-creation push fails
    # with "could not find repo activity". Its commit was attested on the branch it was cut from,
    # and the new branch's next push starts its own provenance. Tag pushes are always creations.
    if: ${{ !github.event.created || github.ref_type == 'tag' }}
    permissions:
      contents: write # pushes the attestations to refs/notes/*
      id-token: write
    # Pins a main commit, not the v0.1.0 tag: v0.1.0 still runs its action from the deprecated
    # slsa-framework/source-actions repo at @main. From this commit on, the reusable workflow
    # checks its own repo out at the same SHA, so this pin freezes the action too.
    uses: slsa-framework/actions/.github/workflows/compute_slsa_source.yml@078463f1155c9295ba9e1b41d49ee2623b4415aa # 2026-10-04 main
